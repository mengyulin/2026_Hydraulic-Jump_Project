name: Check slope P0 on Windows WSL 2 (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slope-wsl:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Preserve Linux script line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - name: Install ephemeral Ubuntu 24.04 in WSL 2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path slope-wsl-report -Force | Out-Null
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber,OsArchitecture | ConvertTo-Json | Out-File slope-wsl-report/windows.json -Encoding utf8
          wsl --version | Out-File slope-wsl-report/wsl-version.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'WSL unavailable.' }
          wsl --set-default-version 2
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select WSL 2.' }
          wsl --install -d Ubuntu-24.04 --no-launch
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install Ubuntu.' }
          wsl --list --verbose | Out-File slope-wsl-report/wsl-distributions.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list WSL distributions.' }
      - name: Complete GC1991 then install slope and run both P0 workflows
        shell: pwsh
        run: |
          $linuxWorkspace = (wsl -d Ubuntu-24.04 -u root --exec wslpath -u $env:GITHUB_WORKSPACE).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot locate acceptance workspace.' }
          wsl -d Ubuntu-24.04 -u root --exec bash "$linuxWorkspace/scripts/check_slope_wsl.sh" "$linuxWorkspace"
          if ($LASTEXITCODE -ne 0) { throw 'Slope acceptance failed; preserve evidence.' }
      - name: Preserve acceptance evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slope-windows-wsl-acceptance
          path: slope-wsl-report/
          if-no-files-found: warn
          retention-days: 14
