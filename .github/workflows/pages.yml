name: Publish student website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out teaching repository
        uses: actions/checkout@v6
      - name: Install documentation renderer
        run: python3 -m pip install -r requirements-site.txt
      - name: Build and verify the student website
        run: |
          python3 scripts/build_site.py
          python3 scripts/check_site.py
          node --check assets/site.js
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish student website
        id: deployment
        uses: actions/deploy-pages@v4
